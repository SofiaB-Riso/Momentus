<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b0d38">
    <title>Entrar - Momentus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>(function(){document.documentElement.setAttribute('data-tema',localStorage.getItem('momentus:tema')||'claro');})();</script>
</head>
<body class="bodyAuth">
    <span class="estrelaAuth e1">✦</span><span class="estrelaAuth e2">✦</span><span class="estrelaAuth e3">✦</span><span class="estrelaAuth e4">✦</span>
    <main class="authShell">
        <section class="authMarca">
            <img src="assets/Logo.png" class="authLogo" alt="Momentus">
            <h1>Transforme cada <em>segundo</em> em uma memória eterna.</h1>
            <p>O planejamento do seu evento, elevado ao nível de obra de arte.</p>
            <span class="authSelo">✦ CADA MOMENTO PERFEITAMENTE PLANEJADO</span>
        </section>
        <section class="authFormulario">
            <div>
                <h2>Bem-vindo</h2>
                <p class="authSub">Acesse sua conta para continuar criando.</p>
            </div>
            <form id="formLogin" class="formAuth">
                <input type="email" id="loginEmail" autocomplete="email" required placeholder="E-mail">
                <input type="password" id="loginSenha" autocomplete="current-password" required placeholder="Senha">
                <div class="authLinhaPequena">
                    <label class="checkAuth"><input type="checkbox" id="mostrarSenhaLogin"> 
                        <svg class="chk-eye-show-password-icon" viewBox="0 0 24 24" aria-hidden="true">
                         <path d="M2.5 12c2.4 4.2 5.6 6.3 9.5 6.3s7.1-2.1 9.5-6.3"/>
                         <path class="chk-eye-show-password-lid" d="M2.5 12c2.4-4.2 5.6-6.3 9.5-6.3s7.1 2.1 9.5 6.3"/>
                         <circle class="chk-eye-show-password-pupil" cx="12" cy="12" r="3.2"/>
                         <path class="chk-eye-show-password-lashes" d="M6.7 16.7l-1.3 2.1M12 18.3v2.5M17.3 16.7l1.3 2.1"/>
                        </svg>
                         <span class="chk-eye-show-password-text">Mostrar senha</span>
                    </label>

                    <a href="cadastro.html">Criar conta</a></div>
                <button class="authBotao" type="submit"><span>Voltar a planejar</span><b>→</b></button>
                <p class="authErro" id="erroLogin" role="alert"></p>
            </form>
            <p class="authRodape">Novo por aqui? <a href="cadastro.html">Crie sua conta</a></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
